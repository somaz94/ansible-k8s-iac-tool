---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2204}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
    # molecule-plugins/docker destroy.yml uses the non-boolean `when: (lookup('env', 'HOME'))`,
    # which ansible-core >= 2.18 rejects. Drop once the plugin is patched (added 2026-05-27).
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "True"
verifier:
  name: ansible
